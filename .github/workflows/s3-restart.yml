name: s3-restart
# Does HydraDB survive a restart on S3-compatible storage (RustFS)? The local
# folder store cannot: object_store LocalFileSystem lacks PutMode::Update.
on:
  push:
    branches: [main]
    paths: ["scripts/restart_test.py", ".github/workflows/s3-restart.yml"]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEY: pagefaultadmin
      SECRET: pagefault-secret-0123456789
      TOKEN: ci-token-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run test
        run: |
          set -x
          mkdir -p experiments out
          exec > >(tee experiments/s3_restart_output.txt) 2>&1
          curl -sSL -o rustfs.zip https://github.com/rustfs/rustfs/releases/download/1.0.4/rustfs-linux-x86_64-musl-v1.0.4.zip
          unzip -o -q rustfs.zip -d rustfs && ls -la rustfs
          RB=$(find rustfs -type f -name 'rustfs*' -perm -u+x | head -1); echo "binary: $RB"
          $RB --help | head -60 || true
          mkdir -p s3data
          RUSTFS_ACCESS_KEY=$KEY RUSTFS_SECRET_KEY=$SECRET RUSTFS_ADDRESS=127.0.0.1:9000 RUSTFS_CONSOLE_ENABLE=false RUSTFS_VOLUMES=$PWD/s3data \
            nohup $RB $PWD/s3data > rustfs.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          tail -5 rustfs.log
          curl -s -w ' make-bucket HTTP %{http_code}\n' -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user "$KEY:$SECRET" http://127.0.0.1:9000/hydradb
          run_node() {
            docker run -d --name pf --network host \
              -e CLOUD_PROVIDER=aws -e AWS_BUCKET_NAME=hydradb -e AWS_DEFAULT_REGION=us-east-1 \
              -e AWS_ENDPOINT=http://127.0.0.1:9000 -e AWS_ALLOW_HTTP=true \
              -e AWS_ACCESS_KEY_ID=$KEY -e AWS_SECRET_ACCESS_KEY=$SECRET \
              -e HYDRADB_TOKEN=$TOKEN -e PORT=8080 \
              ghcr.io/n-45div/hydradb-hack:latest
            for i in $(seq 1 90); do curl -sf http://127.0.0.1:9090/readyz >/dev/null && break; sleep 2; done
            docker logs pf 2>&1 | grep -E '"level":"(WARN|ERROR)"|writers allowed|HydraDB ready|resumed' | tail -8
          }
          run_node
          python3 scripts/restart_test.py before http://127.0.0.1:8443 $TOKEN
          docker rm -f pf
          sleep 2
          run_node
          python3 scripts/restart_test.py after http://127.0.0.1:8443 $TOKEN
          docker logs pf 2>&1 | grep -E '"level":"(WARN|ERROR)"' | tail -5 || true
      - name: Commit output
        if: always()
        run: |
          git config user.name "pagefault-experiments"
          git config user.email "pagefault-experiments@users.noreply.github.com"
          git add experiments/s3_restart_output.txt
          git commit -m "S3 restart test output" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main

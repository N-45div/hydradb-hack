name: hydra-bench
# The full benchmark with HydraDB as the store: 3 repos x 5 training orders,
# filtered and unfiltered test sets. One job per (repo, order), each with its
# own HydraDB graph-node from the published image. Results are merged and
# committed as the headline results/*.json.
on:
  push:
    branches: [main]
    paths: [".github/workflows/hydra-bench.yml", "experiments/hydra-bench-trigger.txt"]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency: hydra-bench
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow
      - run: cargo build --release --bin replay
      - run: python scripts/prepare_data.py --shards 0 1 2 3 4 5 6 --repos pydantic__pydantic tobymao__sqlglot iterative__dvc --max-per-repo 2000
      - run: tar czf bench-inputs.tgz target/release/replay data/sessions
      - uses: actions/upload-artifact@v4
        with:
          name: bench-inputs
          path: bench-inputs.tgz
          retention-days: 2

  bench:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        repo: [pydantic__pydantic, tobymao__sqlglot, iterative__dvc]
        seed: [0, 1, 2, 3, 4]
    env:
      HYDRADB_URL: http://127.0.0.1:8443
      HYDRADB_TOKEN: ci-token-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bench-inputs
      - run: tar xzf bench-inputs.tgz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start HydraDB
        run: |
          mkdir -p hdata && chmod 777 hdata
          docker run -d --name hydra -p 8443:8443 -p 9090:9090 -v $PWD/hdata:/data -e HYDRADB_TOKEN=$HYDRADB_TOKEN ghcr.io/n-45div/hydradb-hack:latest
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:9090/readyz && break; sleep 2; done
      - name: Benchmark on HydraDB
        run: |
          mkdir -p out
          time ./target/release/replay --repos ${{ matrix.repo }} --store hydra --seeds 5 --seed ${{ matrix.seed }} --out out/f.${{ matrix.repo }}.${{ matrix.seed }}.json
          time ./target/release/replay --repos ${{ matrix.repo }} --store hydra --seeds 5 --seed ${{ matrix.seed }} --keep-empty-tests --out out/u.${{ matrix.repo }}.${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.repo }}-${{ matrix.seed }}
          path: out/*.json
          retention-days: 2

  merge:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Merge and commit
        run: |
          ls parts
          mkdir -p results/memory/unfiltered results/unfiltered
          for r in pydantic__pydantic tobymao__sqlglot iterative__dvc; do
            [ -f results/$r.json ] && git mv -f results/$r.json results/memory/$r.json || true
            [ -f results/unfiltered/$r.json ] && git mv -f results/unfiltered/$r.json results/memory/unfiltered/$r.json || true
            python3 scripts/merge_seeds.py results/$r.json parts/f.$r.*.json
            python3 scripts/merge_seeds.py results/unfiltered/$r.json parts/u.$r.*.json
          done
          [ -f results/pydantic_hydradb.json ] && git rm -q results/pydantic_hydradb.json || true
          python3 scripts/summarize.py results/*.json results/unfiltered/*.json > results/SUMMARY.txt
          git config user.name "pagefault-experiments"
          git config user.email "pagefault-experiments@users.noreply.github.com"
          git add results
          git commit -m "Benchmark results on HydraDB: 3 repos x 5 training orders" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main

[package]
name = "pagefault"
version = "0.1.0"
edition = "2021"
description = "Compaction API for coding agents: page context out to a HydraDB graph, page back in what the next step needs, learn from every miss."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
flate2 = "1"
